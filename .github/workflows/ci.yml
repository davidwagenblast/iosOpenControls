name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for runtime in sorted(d, reverse=True):
              if 'iOS' not in runtime: continue
              for dev in d[runtime]:
                  if dev['isAvailable'] and dev['name'].startswith('iPhone'):
                      print(dev['udid']); raise SystemExit
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project OpenControls.xcodeproj \
            -scheme OpenControls \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log | tail -n 200
        env:
          NSUnbufferedIO: "YES"

      - name: Confirm every target was compiled
        run: |
          for t in OpenControlsParent OpenControlsKid OpenControlsKidMonitor OpenControlsKidShieldConfig OpenControlsKidShieldAction OpenControlsTests; do
            if grep -q "SwiftDriver $t\|SwiftCompile.*$t\|Build.*$t" build.log || grep -q "$t" build.log; then echo "built: $t"; else echo "MISSING: $t"; exit 1; fi
          done
          grep -c "warning:" build.log || true
          grep "warning:" build.log | sort -u | head -40 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
